<app-section-title [title]="'Hola, soy ' + profile.name" subtitle="Portafolio móvil"></app-section-title>

<section class="hero-profile">
  <img class="avatar" [src]="profile.photoUrl" [alt]="'Foto de ' + profile.name" />
  <div class="identity">
    <p class="role">{{ profile.role }}</p>
    <p class="location">{{ profile.location }}</p>
  </div>
</section>

<p class="summary">{{ profile.summary }}</p>

<section class="featured">
  <h3>Proyectos destacados</h3>
  <div class="list">
    <app-project-card *ngFor="let project of featuredProjects" [project]="project"></app-project-card>
  </div>
</section>

<a class="view-all" routerLink="/proyectos">Ver todos los proyectos</a>
