<article class="project-card">
  <h3>{{ project.title }}</h3>
  <p>{{ project.description }}</p>

  <ul>
    <li *ngFor="let tech of project.technologies">{{ tech }}</li>
  </ul>

  <div class="actions">
    <a *ngIf="project.demoUrl" [href]="project.demoUrl" target="_blank" rel="noopener">Demo</a>
    <a *ngIf="project.repositoryUrl" [href]="project.repositoryUrl" target="_blank" rel="noopener">Código</a>
  </div>
</article>
